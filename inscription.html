<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion | CampusLogis</title>

    <link rel="stylesheet" href="assets/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <section class="breadcrumb">

    <div class="container">

        <a href="index.html">Accueil</a>

        <span>></span>

        <span>Dashboard propriétaire</span>

    </div>

</section>

<section class="auth">

    <div class="auth-container">

        <div class="auth-image">

            <img src="images/login.png.jpg" alt="Inscription">

        </div>

        <div class="auth-form">

            <h2>Créer un compte 🚀</h2>

            <p>Rejoignez CampusLogis dès aujourd'hui.</p>

            <form id="registerForm">

                <div class="input-group">
                    <label>Nom complet</label>
                    <input type="text" id="nom" placeholder="Votre nom complet">
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Votre email">
                </div>

                <div class="input-group">
                    <label>Téléphone</label>
                    <input type="text" id="telephone" placeholder="+221 ...">
                </div>

                <div class="input-group">
                    <label>Je suis :</label>

                    <select id="role">

                        <option value="">Choisir un rôle</option>
                        <option value="etudiant">Étudiant</option>
                        <option value="proprietaire">Propriétaire</option>

                    </select>

                </div>

                <div class="input-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password">
                </div>

                <div class="input-group">
                    <label>Confirmer le mot de passe</label>
                    <input type="password" id="confirmPassword">
                </div>

                <button class="login-btn">

                    Créer un compte

                </button>

            </form>

            <p>

                Déjà un compte ?

                <a href="connexion.html">

                    Se connecter

                </a>

            </p>

        </div>

    </div>

</section>

<script src="assets/js/main.js"></script>

</body>

</html>
